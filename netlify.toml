[functions]
  external_node_modules = ["ky-universal", "ky", "core-js", "security-context"]
  node_bundler = "esbuild"
  included_files = ["node_modules/*"]

[build.environment]
  NODE_VERSION = "22"

[dev]
  functionsPort = 5080

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
