AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TrustVC Storage (Lambda + REST API + S3)

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Architectures: [x86_64]

Resources:
  StorageReservationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "trustvc/${Env}/storage-reservation-secret"
      Description: Server-side secret used to derive storage reservation keys.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  StorageFunction:
    Type: AWS::Serverless::Function
    DependsOn: StorageReservationSecret
    Properties:
      FunctionName: !Sub "trustvc-storage-function-${Env}"
      CodeUri: ./
      Handler: index.handler
      Environment:
        Variables:
          TT_AWS_BUCKET_NAME: !Sub "trustvc-storage-${Env}"
          ENV: !Ref Env
          API_KEY: !Sub "{{resolve:ssm:/trustvc/${Env}/api-key}}"
          STORAGE_RESERVATION_SECRET: !Sub "{{resolve:secretsmanager:trustvc/${Env}/storage-reservation-secret:SecretString}}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "trustvc-storage-${Env}"
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        External:
          - core-js
          - ky-universal
          - ky
          - web-streams-polyfill
          - security-context
        EntryPoints:
          - src/functions/storage/index.ts

Outputs:
  ApiUrl:
    Description: Invoke URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
